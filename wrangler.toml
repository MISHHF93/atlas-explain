# Hosted ATLAS Explain MCP server on Cloudflare Workers (free plan). See docs/MCP.md.
# Owner, once: `npx wrangler@4 login` (free Cloudflare account, no card), then `npm run deploy:mcp`.
name = "atlas-explain-mcp"
main = "src/mcp/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Live data: captured on a schedule by this Worker (src/data/capture.ts) and served at /data/v1/.
# One cron per part keeps each run inside the free plan's CPU and subrequest limits. These three
# strings must match CRONS in src/mcp/worker.ts.
[triggers]
crons = ["*/10 * * * *", "37 */3 * * *", "47 */6 * * *", "17 */6 * * *"]

# Free Workers KV namespace holding market.json, news.json and crypto.json (keys data/v1/<file>).
[[kv_namespaces]]
binding = "DATA"
id = "3b50fb5cbf73422f89f22cfbbc2d64b9"

# Connector usage counts for the owner's admin view (src/mcp/stats.ts, docs/ADMIN.md): one SQLite-backed
# Durable Object, free on the Workers Free plan. Only counts are kept, never questions, answers or IPs.
# Who may read them is the ADMIN_EMAILS secret: `npx wrangler@4 secret put ADMIN_EMAILS`.
[[durable_objects.bindings]]
name = "STATS"
class_name = "UsageStats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageStats"]

# v2 tools switched on (docs/V2_DESIGN.md, feature flags): a comma list, for example "rate_change_impact".
# Empty keeps the public connector exactly as it is.
[vars]
V2_TOOLS = "rate_change_impact,decision_explainer,speech_tracker,inflation_calculator"
# "1" counts partner usage in ATLAS credits (docs/USAGE_PRICING.md); "0" keeps one call per request.
CREDITS_ENABLED = "0"
