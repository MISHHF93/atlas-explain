<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ATLAS Explain">
  <!-- App icon for directories and the connector: full-bleed square (no rounded corners, no white),
       with the logo mark scaled into the central safe zone so it fits inside a circle, a rounded
       square or a square crop. The website's own logo stays public/logo.svg. -->
  <defs>
    <linearGradient id="atlas-app-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7d6e"/>
      <stop offset="1" stop-color="#0a5a4f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#atlas-app-bg)"/>
  <g transform="translate(32 32) scale(0.72) translate(-33.5 -30)">
    <path d="M14 49 L32 16 L50 49" fill="none" stroke="#fffdf8" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M23.5 38.5 H40.5" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="49" cy="15" r="5.5" fill="#3dbea8" stroke="#fffdf8" stroke-width="2.5"/>
  </g>
</svg>
