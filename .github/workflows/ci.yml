name: CI

on:
  push:
  pull_request:

jobs:
  # The same gate that is run by hand before every push: types, lint, tests, both builds,
  # manifest least-privilege, bundle budget, npm audit and the trade-word scan.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check

  # Firestore security rules against the real rules engine (Firestore emulator, Java 21).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
